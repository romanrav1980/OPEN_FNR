name: ${OPEN_FNR_PROJECT:-open-fnr-dev}

services:
  backend:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-backend
    restart: unless-stopped
    environment:
      OPEN_FNR_RUNTIME_MODE: ${OPEN_FNR_RUNTIME_MODE:-dev}
      OPEN_FNR_MOCK_MODE: ${OPEN_FNR_MOCK_MODE:-true}
      OPEN_FNR_AUDIT_ENABLED: ${OPEN_FNR_AUDIT_ENABLED:-true}
      OPEN_FNR_SERVICE_HOST: ${OPEN_FNR_SERVICE_HOST:-127.0.0.1}
      OPEN_FNR_POSTGRES_HOST: ${OPEN_FNR_POSTGRES_HOST:-postgres}
      OPEN_FNR_CLICKHOUSE_HOST: ${OPEN_FNR_CLICKHOUSE_HOST:-clickhouse}
      OPEN_FNR_FLOWABLE_HOST: ${OPEN_FNR_FLOWABLE_HOST:-flowable}
      OPEN_FNR_AIRFLOW_HOST: ${OPEN_FNR_AIRFLOW_HOST:-airflow-webserver}
      OPEN_FNR_OPENSEARCH_HOST: ${OPEN_FNR_OPENSEARCH_HOST:-opensearch}
      OPEN_FNR_SUPERSET_HOST: ${OPEN_FNR_SUPERSET_HOST:-superset}
      OPEN_FNR_POSTGRES_PORT: ${OPEN_FNR_POSTGRES_SERVICE_PORT:-5432}
      OPEN_FNR_CLICKHOUSE_HTTP_PORT: ${OPEN_FNR_CLICKHOUSE_HTTP_SERVICE_PORT:-8123}
      OPEN_FNR_FLOWABLE_PORT: ${OPEN_FNR_FLOWABLE_SERVICE_PORT:-8080}
      OPEN_FNR_AIRFLOW_PORT: ${OPEN_FNR_AIRFLOW_SERVICE_PORT:-8080}
      OPEN_FNR_OPENSEARCH_PORT: ${OPEN_FNR_OPENSEARCH_SERVICE_PORT:-9200}
      OPEN_FNR_SUPERSET_PORT: ${OPEN_FNR_SUPERSET_SERVICE_PORT:-8088}
      OPEN_FNR_POSTGRES_USER: ${POSTGRES_USER:-open_fnr}
      OPEN_FNR_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_fnr_dev}
      OPEN_FNR_POSTGRES_DATABASE: ${POSTGRES_DB:-open_fnr}
      OPEN_FNR_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-open_fnr}
      OPEN_FNR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_fnr_dev}
      OPEN_FNR_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-open_fnr}
      OPEN_FNR_ERP_EXPORT_URL: ${OPEN_FNR_ERP_EXPORT_URL:-}
      OPEN_FNR_WMS_EXPORT_URL: ${OPEN_FNR_WMS_EXPORT_URL:-}
      OPEN_FNR_DWH_EXPORT_URL: ${OPEN_FNR_DWH_EXPORT_URL:-}
      OPEN_FNR_BI_EXPORT_URL: ${OPEN_FNR_BI_EXPORT_URL:-}
      OPEN_FNR_AUTO_ORDER_EXPORT_URL: ${OPEN_FNR_AUTO_ORDER_EXPORT_URL:-}
      OPEN_FNR_SUPPLIER_FORECAST_SHARE_URL: ${OPEN_FNR_SUPPLIER_FORECAST_SHARE_URL:-}
      OPEN_FNR_PUBLICATION_HTTP_TIMEOUT_SECONDS: ${OPEN_FNR_PUBLICATION_HTTP_TIMEOUT_SECONDS:-30}
      OPEN_FNR_LANDING_ROOT_PATH: /data/landing
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../data/landing:/data/landing
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_fnr}
      POSTGRES_USER: ${POSTGRES_USER:-open_fnr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_fnr_dev}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_fnr} -d ${POSTGRES_DB:-open_fnr}"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-open_fnr}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-open_fnr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_fnr_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  flowable:
    image: flowable/flowable-rest:7.1.0
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-flowable
    restart: unless-stopped
    ports:
      - "${FLOWABLE_PORT:-18080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-open_fnr}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-open_fnr}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-open_fnr_dev}
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response --spider http://localhost:8080/flowable-rest/service/management/engine 2>&1 | grep -E 'HTTP/.* (200|401)'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  airflow-postgres:
    image: postgres:16
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow} -d ${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:${AIRFLOW_POSTGRES_SERVICE_PORT:-5432}/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    command: ["bash", "-c", "airflow db migrate && airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD}\" --firstname Admin --lastname User --role Admin --email admin@example.com || true"]
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-airflow-webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:${AIRFLOW_POSTGRES_SERVICE_PORT:-5432}/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: ["airflow", "webserver"]
    ports:
      - "${AIRFLOW_PORT:-18088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://localhost:8080/health', timeout=5)\nPY"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-airflow-scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:${AIRFLOW_POSTGRES_SERVICE_PORT:-5432}/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-OpenFNR_dev_123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-19200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-15601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  superset:
    image: apache/superset:4.1.1
    container_name: ${OPEN_FNR_PROJECT:-open-fnr-dev}-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-open_fnr_dev_secret_key_change_me}
    ports:
      - "${SUPERSET_PORT:-18089}:8088"
    volumes:
      - superset-data:/app/superset_home
    command: ["/bin/sh", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true && superset init && superset run -h 0.0.0.0 -p 8088"]

volumes:
  postgres-data:
  clickhouse-data:
  airflow-postgres-data:
  opensearch-data:
  superset-data:
